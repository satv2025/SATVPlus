<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cuenta · SATV+</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/account.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="icon" href="/images/satvpluslogopro.png" />
</head>
<body>
  <header class="topnav">
    <div class="nav-inner container" id="topnav"></div>
  </header>

  <main class="container account-page">
    <section class="account-panel">
      <header class="account-header">
        <div>
          <span class="account-kicker">SATV+</span>
          <h1>Cuenta</h1>
          <p>Administrá los datos generales de tu cuenta. Los perfiles de visualización se editan por separado.</p>
        </div>
        <a class="btn ghost" href="/profiles.html">
          <i class="fa-solid fa-users-gear" aria-hidden="true"></i>
          Ver y editar perfiles
        </a>
      </header>

      <form id="account-form" class="account-form" autocomplete="on">
        <div class="account-grid">
          <label class="account-field">
            <span>Correo electrónico</span>
            <input id="account-email" type="email" required autocomplete="email" />
            <small>Si lo cambiás, Supabase puede pedir confirmación por correo.</small>
          </label>

          <label class="account-field">
            <span>Nombre</span>
            <input id="account-name" type="text" maxlength="80" autocomplete="name" placeholder="Tu nombre" />
          </label>

          <label class="account-field">
            <span>Usuario</span>
            <input id="account-username" type="text" maxlength="40" autocomplete="username" placeholder="Tu usuario" />
          </label>

          <label class="account-field">
            <span>Teléfono</span>
            <input id="account-phone" type="tel" maxlength="40" autocomplete="tel" placeholder="Tu teléfono" />
          </label>
        </div>

        <div class="account-readonly-row">
          <span>
            <small>Cuenta creada</small>
            <strong id="account-created">—</strong>
          </span>
          <span>
            <small>ID de cuenta</small>
            <strong id="account-id">—</strong>
          </span>
        </div>

        <div class="account-actions">
          <button id="account-save" class="btn" type="submit">
            <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
            Guardar cambios
          </button>
        </div>

        <p id="account-status" class="account-status muted" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <div class="toast-host" id="toast-host"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/js/profile.js"></script>
</body>
</html>
