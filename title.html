<!doctype html>
<html lang="es">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Título · SATV+</title>

        <link rel="stylesheet" href="/css/styles.css">
        <link rel="stylesheet" href="/css/title.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="icon" href="/images/satvpluslogopro.png">
    </head>

    <body>
        <header class="topnav">
            <div class="nav-inner container" id="topnav"></div>
        </header>

        <main>
            <!-- HERO -->
            <section id="hero" class="title-hero">
                <div class="container title-hero-inner">
                    <h1 id="t-title" style="margin:0;"></h1>
                    <div id="t-meta" class="title-meta"></div>
                    <p id="t-sinopsis"></p>

                    <div class="title-actions">
                        <!-- JS setea: Reproducir / Reanudar -->
                        <a id="watch-btn" class="btn-primary" href="#" aria-label="Reproducir"></a>

                        <button id="episodes-jump" class="btn-ghost" type="button">
                            <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1920"
                                aria-hidden="true">
                                <path
                                    d="M866.332 213v653.332H213v186.666h653.332v653.332h186.666v-653.332h653.332V866.332h-653.332V213z"
                                    fill-rule="evenodd"></path>
                            </svg>
                            <span class="btn-label">Mi Lista</span></button>
                        <a id="trailer-btn" class="btn-ghost hidden" href="#" target="_blank" rel="noopener">🎞
                            Trailer</a>
                    </div>
                </div>
            </section>

            <!-- EPISODIOS -->
            <section class="container" id="episodes-section" style="padding: 18px 0 10px;">
                <div class="section-head">
                    <h2 class="section-title" id="episodes-title" style="margin:0;"></h2>
                </div>
                <div id="season-filter" class="season-filter hidden"></div>
                <div id="episodes-grid" class="episodes-grid hidden"></div>
            </section>

            <!-- TE PODRÍA GUSTAR -->
            <section class="container" id="more-section" style="padding: 18px 0 10px;">
                <div class="section-head">
                    <h2 class="section-title" style="margin:0;">Te podría gustar</h2>
                </div>
                <div id="more-grid" class="episodes-grid"></div>
            </section>

            <!-- INFO COMPLETA -->
            <section class="container title-extra hidden" id="title-extra"></section>
        </main>

        <div class="toast-host" id="toast-host"></div>
        <script type="module" src="/js/title.js"></script>
    </body>

</html>
