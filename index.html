<!doctype html>
<html lang="es">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Página de Inicio · SATV+</title>

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" href="images/satvpluslogo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  </head>

  <body>
    <header class="topnav">
      <div class="nav-inner container" id="topnav">
        <a class="navlink" href="/mylist?list={list_id}&user={user_id}">Mi Lista</a>
      </div>
    </header>

    <main class="container">
      <section class="section hidden" id="continue-wrap">
        <div class="section-head">
          <h2 class="section-title">Continuar viendo</h2>
        </div>
        <div class="row" id="continue-row" data-arrows="1"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Recomendados</h2>
        </div>
        <div class="row" id="latest-row" data-arrows="1"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Películas</h2>
        </div>
        <div class="row" id="movies-row" data-arrows="1"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Series</h2>
        </div>
        <div class="row" id="series-row" data-arrows="1"></div>
      </section>
    </main>

    <div class="toast-host" id="toast-host"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/js/home.js"></script>
  </body>

</html>
