<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Elegir perfil · SATV+</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/profiles.css" />
  <link rel="icon" href="/images/satvpluslogopro.png" />
</head>
<body class="profiles-page">
  <main class="profiles-shell">
    <img class="profiles-logo" src="/images/satvpluslogo.png" alt="SATV+" />
    <h1 id="profiles-title">¿Quién está mirando?</h1>
    <p id="profiles-subtitle" class="muted">Elegí un perfil para continuar.</p>

    <section id="profiles-grid" class="profiles-grid" aria-live="polite"></section>

    <div class="profiles-actions">
      <button id="manage-btn" class="btn ghost" type="button">Administrar perfiles</button>
      <a class="btn ghost" href="/profile.html">Datos de la cuenta</a>
      <button id="logout-btn" class="btn ghost" type="button">Cerrar sesión</button>
    </div>
  </main>

  <div id="profile-modal" class="profile-modal-backdrop" hidden>
    <form id="profile-form" class="profile-modal" autocomplete="off">
      <div class="profile-modal-head">
        <div>
          <h2 id="profile-modal-title">Crear perfil</h2>
          <p class="muted">Nombre y avatar del perfil.</p>
        </div>
        <button id="profile-modal-close" type="button" class="profile-modal-close" aria-label="Cerrar">×</button>
      </div>

      <label for="profile-name">Nombre</label>
      <input id="profile-name" maxlength="30" required placeholder="Nombre del perfil" />

      <div class="avatar-label">Elegí un avatar</div>
      <div id="avatar-grid" class="avatar-grid"></div>

      <label class="kids-toggle">
        <input id="profile-kids" type="checkbox" />
        <span>Perfil infantil</span>
      </label>

      <div class="profile-modal-actions">
        <button class="btn" type="submit">Guardar perfil</button>
        <button id="profile-cancel" class="btn ghost" type="button">Cancelar</button>
      </div>
    </form>
  </div>

  <div class="toast-host" id="toast-host"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/js/profiles.js"></script>
</body>
</html>
